<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CTA + Trust UI</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section class="cta-section">
      <div class="cta-content">
        <h1>Grow Your Business with Expert Guidance</h1>
        <p class="subtext">Get tailored support to scale faster and smarter.</p>

        <div class="cta-buttons">
          <button id="primaryCTA" class="btn-primary">Join Kubest Now</button>
          <a href="#" class="secondary-link">Learn more</a>
        </div>
      </div>

      <div class="trust-logos">
        <p class="trusted-by">Trusted by parter companies worldwide</p>
        <div class="logo-grid">
          <img src="/download (1).png" alt="Logo 1" />
          <img src="/download (2).png" alt="Logo 2" />
          <img src="/download (3).png" alt="Logo 3" />
        </div>
      </div>
    </section>

    <script src="script.js"></script>
  </body>
</html>
